name: App Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore test project
        run: dotnet restore RentalApp.Test/RentalApp.Test.csproj

      - name: Build test project
        run: dotnet build RentalApp.Test/RentalApp.Test.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test RentalApp.Test/RentalApp.Test.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
